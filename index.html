<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#6657d7"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon-192.png">
  <title>WordNest · 智能词汇本</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root{--p:#6657d7;--ink:#25233a;--muted:#878496;--line:#e9e7ef}*{box-sizing:border-box}body{margin:0;background:#fafafd;color:var(--ink);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.side{position:fixed;inset:0 auto 0 0;width:230px;background:#fff;border-right:1px solid var(--line);padding:28px 18px;display:flex;flex-direction:column}.brand{font-size:20px;font-weight:800;padding:0 12px 30px}.brand i{display:inline-grid;place-items:center;width:33px;height:33px;border-radius:10px;background:var(--p);color:#fff;font:800 18px Georgia;margin-right:10px}.nav{display:grid;gap:7px}.nav button{height:48px;border:0;border-radius:11px;background:transparent;text-align:left;padding:0 16px;color:#706e81}.nav button.active{background:#efedff;color:#5749c4;font-weight:700}.profile{margin-top:auto;border-top:1px solid var(--line);padding-top:18px;font-size:12px}.profile b{display:inline-grid;place-items:center;width:35px;height:35px;border-radius:50%;background:#dcf0e9;color:#387765;margin-right:9px}.main{margin-left:230px;width:calc(100% - 230px)}header{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 42px;font-size:13px}.content{max-width:1050px;margin:auto;padding:55px}.eyebrow{color:#9995a6;font-size:10px;letter-spacing:2px;font-weight:800}.hero{display:flex;justify-content:space-between;align-items:center;margin-bottom:45px}.hero h1,.page h1{font:500 40px/1.25 Georgia,"Songti SC",serif;margin:12px 0 18px}.hero p,.sub{color:var(--muted);font-size:13px}.primary{border:0;border-radius:10px;background:var(--p);color:#fff;padding:14px 20px;font-weight:700;font-size:12px}.ring{width:155px;height:155px;border-radius:50%;background:conic-gradient(var(--p) 68%,#e8e6f1 0);display:grid;place-items:center}.ring:after{content:"68%";display:grid;place-items:center;width:125px;height:125px;background:#fafafd;border-radius:50%;font:500 27px Georgia}.quick{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0 25px}.action{background:#fff;border:1px solid var(--line);border-radius:14px;padding:19px;text-align:left}.action strong{display:block;margin-bottom:6px}.action small{color:var(--muted)}.panels{display:grid;grid-template-columns:1.15fr 1fr;gap:18px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}.panel h2{font-size:16px;margin:0 0 6px}.panel>p{font-size:10px;color:var(--muted);margin:0 0 18px}.book{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;margin:15px 0}.cover{width:38px;height:44px;border-radius:4px 8px 8px 4px;background:var(--p);color:#fff;display:grid;place-items:center;font:12px Georgia}.book b{font-size:11px}.book small{display:block;color:var(--muted);font-size:9px;margin-top:4px}.bar{height:4px;background:#eeeeF4;border-radius:4px;overflow:hidden;margin-top:7px}.bar i{display:block;height:100%;background:var(--p)}.book em{font-size:10px;font-style:normal;color:#777}.chart{height:150px;display:flex;gap:12px;align-items:end}.chart i{width:13%;background:#d9d5f5;border-radius:5px 5px 0 0}.chart i:nth-child(6){background:var(--p)}.search{display:flex;background:#fff;border:1px solid var(--line);border-radius:13px;padding:6px}.search input{flex:1;min-width:0;border:0;outline:0;padding:12px;background:#fff;color:#25233a;caret-color:#6657d7;font-size:16px;-webkit-appearance:none;appearance:none;-webkit-user-select:text;user-select:text;pointer-events:auto}.search button{border:0;background:var(--ink);color:#fff;border-radius:9px;padding:0 24px}.word{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;margin-top:25px}.word h2{font:500 34px Georgia;margin:0 0 5px}.word .phon{color:var(--p)}.meaning{font-size:16px;font-weight:700;margin:25px 0}.example{background:#f5f4f9;border-radius:10px;padding:16px;margin-bottom:20px}.bookgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}.bookcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.bookcard .large{height:120px;border-radius:10px;background:var(--p);color:#fff;padding:20px;font:25px Georgia}.bookcard h3{font-size:14px}.bookcard p{font-size:10px;color:var(--muted)}.bookcard button{border:0;background:transparent;color:var(--p);font-size:11px;font-weight:700;padding:10px 0}.quiz{max-width:600px;margin:auto}.progress{height:5px;background:#e8e6f1;border-radius:5px;margin-bottom:30px}.progress i{display:block;height:100%;background:var(--p)}.quizcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:45px 55px;text-align:center}.play{display:block;margin:24px auto 15px;width:88px;height:88px;border:0;border-radius:50%;background:var(--p);color:#fff;font-size:27px}.quizcard input{width:100%;padding:15px;text-align:center;border:1px solid var(--line);border-radius:10px;outline:0;font-size:18px;margin:25px 0 15px}.feedback{padding:10px;border-radius:8px;margin-bottom:12px;font-size:12px}.ok{background:#ebf9f2;color:#327b61}.bad{background:#fff0ee;color:#ad554e}.toast{position:fixed;right:25px;bottom:25px;background:#26243a;color:#fff;border-radius:10px;padding:13px 18px;font-size:12px}.hide{display:none!important}
    @media(max-width:800px){.side{width:70px;padding:25px 10px}.brand{font-size:0}.brand i{margin:0}.nav button{font-size:0;text-align:center}.nav button:before{content:"●";font-size:16px}.profile{display:none}.main{margin-left:70px;width:calc(100% - 70px)}.content{padding:35px 22px}.panels,.quick{grid-template-columns:1fr}.bookgrid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.ring{display:none}.hero h1,.page h1{font-size:31px}.bookgrid{grid-template-columns:1fr}.quizcard{padding:35px 20px}.search{display:grid;gap:8px;padding:8px}.search input{width:100%;height:52px}.search button{width:100%;height:48px}}
  </style>
  <style>
    .vkeyboard{display:none}
    @media(max-width:800px){
      .vkeyboard{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:10px 0 18px}
      .vkeyboard button{min-width:0;height:38px;border:1px solid #dedbea;border-radius:7px;background:#fff;color:#25233a;font-size:13px;font-weight:700;padding:0}
      .vkeyboard button.wide{grid-column:span 2;background:#efedff;color:#5749c4}
      .vkeyboard button.delete{background:#fff0ee;color:#ad554e}
      .side{inset:auto 0 0 0;width:100%;height:70px;padding:7px 8px;background:#fff;border-right:0;border-top:1px solid #e9e7ef;z-index:30}
      .side .brand,.side .profile{display:none}
      .side .nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%}
      .side .nav button,.side .nav button.active{height:55px;padding:4px 2px;font-size:12px;text-align:center;white-space:nowrap}
      .side .nav button:before{display:none;content:none}
      .main{margin-left:0;width:100%;padding-bottom:76px}
      header{padding:0 18px}
      .content{padding:28px 18px}
    }
  </style>
</head>
<body><div class="app">
  <aside class="side"><div class="brand"><i>W</i>WordNest</div><nav class="nav">
    <button data-view="home" class="active">⌂　学习首页</button><button data-view="dictionary">⌕　查词</button><button data-view="books">▤　我的词书</button><button data-view="dictation">◉　听写练习</button>
  </nav><div class="profile">连续学习 7 天 🔥</div></aside>
  <div class="main"><header><span id="title">欢迎回来 👋</span><span><button id="install" class="hide" style="border:0;border-radius:8px;background:#6657d7;color:#fff;padding:8px 12px">安装 App</button>　帮助　♢</span></header><div class="content">
    <section id="home" class="view"><div class="hero"><div><span class="eyebrow">TODAY · JUL 28</span><h1>把今天的新词，<br>变成明天的表达。</h1><p>今天还有 12 个单词等待复习，大约需要 8 分钟。</p><button class="primary" onclick="go('dictation')">开始今日学习　→</button></div><div class="ring"></div></div>
      <h2>快速开始</h2><div class="quick"><button class="action" onclick="go('dictionary')"><strong>⌕　查一个新单词</strong><small>查询释义并自动收入生词本</small></button><button class="action" onclick="file.click()"><strong>⇧　导入 Excel 词表</strong><small>自动识别单词、音标与释义</small></button></div>
      <div class="panels"><div class="panel"><h2>我的词书</h2><p id="summary"></p><div id="homeBooks"></div></div><div class="panel"><h2>学习节奏</h2><p>最近 7 天 · 42 个新词</p><div class="chart"><i style="height:42%"></i><i style="height:68%"></i><i style="height:35%"></i><i style="height:82%"></i><i style="height:58%"></i><i style="height:92%"></i><i style="height:70%"></i></div></div></div>
    </section>
    <section id="dictionary" class="view hide page"><span class="eyebrow">DICTIONARY</span><h1>今天想认识哪个单词？</h1><p class="sub">查过的单词，可以一键收入你的专属词汇本。</p><div class="search"><input id="query" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="latin" placeholder="输入英文单词，例如 serendipity"><button onclick="clearQuery()" style="background:#efedf8;color:#6657d7">清空</button><button onclick="lookup()">查询</button></div><div class="vkeyboard" data-target="query"></div><div id="result"></div></section>
    <section id="books" class="view hide page"><span class="eyebrow">WORD BOOKS</span><h1>把零散的单词，整理成体系。</h1><p class="sub">支持 Excel / CSV，默认读取：单词、音标、释义、例句四列。</p><button class="primary" onclick="file.click()">⇧ 导入词表</button><div class="bookgrid" id="bookGrid"></div></section>
    <section id="dictation" class="view hide page quiz"><div class="progress"><i id="qbar"></i></div><div class="quizcard"><span class="eyebrow">听音频，拼出这个单词</span><button class="play" onclick="speak(current().term)">▶</button><small>点击可重复播放</small><input id="answer" autocomplete="off" autocapitalize="none" spellcheck="false" inputmode="latin" placeholder="在这里输入单词"><div class="vkeyboard" data-target="answer"></div><div id="feedback"></div><button class="primary" style="width:100%" onclick="check()">检查拼写</button></div></section>
  </div></div><input id="file" type="file" accept=".xlsx,.xls,.csv" hidden><div id="toast" class="toast hide"></div>
</div>
<script>
const seed=[['serendipity','/ˌserənˈdɪpəti/','n. 意外发现美好事物的运气','Finding this café was pure serendipity.','我的生词本'],['resilient','/rɪˈzɪliənt/','adj. 有韧性的；能迅速恢复的','Children are often more resilient than we expect.','我的生词本'],['meticulous','/məˈtɪkjələs/','adj. 一丝不苟的；严谨的','She kept meticulous notes.','雅思核心词汇'],['eloquent','/ˈeləkwənt/','adj. 雄辩的；有说服力的','He gave an eloquent speech.','雅思核心词汇'],['ubiquitous','/juːˈbɪkwɪtəs/','adj. 无处不在的','Smartphones have become ubiquitous.','学术英语']].map(x=>({term:x[0],phonetic:x[1],meaning:x[2],example:x[3],book:x[4],mastered:false}));
const dict=Object.fromEntries(seed.map(x=>[x.term,x]));let words=JSON.parse(localStorage.getItem('wordnest')||'null')||seed,qi=0,last=null;
const $=s=>document.querySelector(s);function save(){localStorage.setItem('wordnest',JSON.stringify(words));render()}function toast(s){$('#toast').textContent='✓ '+s;$('#toast').classList.remove('hide');setTimeout(()=>$('#toast').classList.add('hide'),2200)}
function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.toggle('hide',x.id!==v));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.view===v));$('#title').textContent={home:'欢迎回来 👋',dictionary:'词典',books:'我的词书',dictation:'听写练习'}[v];if(v==='dictation'){renderQuiz();setTimeout(()=>speak(current().term),100)}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.view));function books(){return [...new Set(words.map(x=>x.book))].map(name=>({name,list:words.filter(x=>x.book===name)}))}
function render(){let bs=books();$('#summary').textContent=`${bs.length} 本词书 · 共 ${words.length} 个单词`;$('#homeBooks').innerHTML=bs.slice(0,3).map((b,i)=>`<div class="book"><span class="cover">${i?'Aa':'W'}</span><div><b>${b.name}</b><small>${b.list.length} 个单词</small><div class="bar"><i style="width:${b.list.filter(x=>x.mastered).length/b.list.length*100}%"></i></div></div><em>${Math.round(b.list.filter(x=>x.mastered).length/b.list.length*100)}%</em></div>`).join('');$('#bookGrid').innerHTML=bs.map((b,i)=>`<article class="bookcard"><div class="large" style="background:${['#6657d7','#e88a54','#3f8c7a'][i%3]}">Aa</div><h3>${b.name}</h3><p>${b.list.length} 个单词 · 已掌握 ${b.list.filter(x=>x.mastered).length}</p><div class="bar"><i style="width:${b.list.filter(x=>x.mastered).length/b.list.length*100}%"></i></div><div style="margin-top:12px">${b.list.map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eee;padding:8px 0;font-size:11px"><span>${x.term}</span><button onclick="removeWord(${words.indexOf(x)})" style="color:#c45555">删除</button></div>`).join('')}</div><button onclick="go('dictation')">开始听写 →</button></article>`).join('')}
async function lookup(){let q=$('#query').value.trim().toLowerCase();if(!q)return;if(!/^[a-z'-]+$/.test(q))return toast('请输入英文单词');let fixes={extention:'extension',recieve:'receive',seperate:'separate'};if(fixes[q]){$('#query').value=fixes[q];q=fixes[q];toast(`已自动更正为 ${q}`)}$('#result').innerHTML='<article class="word"><div class="meaning">正在查询词典…</div></article>';try{if(dict[q])last=dict[q];else{let res=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(q));if(!res.ok)throw new Error('not-found');let data=await res.json(),entry=data[0],meaning=entry.meanings?.[0],def=meaning?.definitions?.[0],english=def?.definition||'No definition available.',chinese='';try{let tr=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(english)+'&langpair=en|zh-CN'),tj=await tr.json();chinese=tj.responseData?.translatedText||''}catch(e){}last={term:entry.word||q,phonetic:entry.phonetic||entry.phonetics?.find(x=>x.text)?.text||'/ — /',meaning:(meaning?.partOfSpeech?meaning.partOfSpeech+'. ':'')+(chinese||english),example:def?.example||english,book:'我的生词本'}}$('#result').innerHTML=`<article class="word"><button style="float:right" onclick="speak('${last.term}')">🔊</button><h2>${last.term}</h2><div class="phon">${last.phonetic}</div><div class="meaning">${last.meaning}</div><div class="example">${last.example}</div><button class="primary" style="width:100%" onclick="add()">＋ 加入我的生词本</button></article>`}catch(e){last=null;$('#result').innerHTML=`<article class="word"><h2>${q}</h2><div class="meaning">没有查到这个单词</div><div class="example">请检查拼写后重试。例如：extension</div></article>`}}
function add(){if(words.some(x=>x.term===last.term))return toast('这个单词已经在词汇本里了');words.unshift({...last,book:'我的生词本'});save();toast(`已将 ${last.term} 加入生词本`)}
function clearQuery(){$('#query').value='';$('#result').innerHTML='';$('#query').focus()}
function removeWord(i){if(i<0||!words[i])return;if(confirm(`确定删除 ${words[i].term} 吗？`)){words.splice(i,1);save();toast('单词已删除')}}
function virtualKey(id,key){let input=$('#'+id);if(key==='BACK')input.value=input.value.slice(0,-1);else if(key==='CLEAR')input.value='';else input.value+=key;input.dispatchEvent(new Event('input',{bubbles:true}))}
function buildKeyboards(){let letters='qwertyuiopasdfghjklzxcvbnm'.split('');document.querySelectorAll('.vkeyboard').forEach(k=>{let id=k.dataset.target;k.innerHTML=letters.map(c=>`<button type="button" onclick="virtualKey('${id}','${c}')">${c.toUpperCase()}</button>`).join('')+`<button type="button" class="wide delete" onclick="virtualKey('${id}','BACK')">⌫ 退格</button><button type="button" class="wide" onclick="virtualKey('${id}','CLEAR')">清空</button>`});if(matchMedia('(max-width:800px)').matches){['query','answer'].forEach(id=>{$('#'+id).readOnly=true;$('#'+id).setAttribute('inputmode','none')})}}
function speak(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}function current(){return words[qi%words.length]}function renderQuiz(){$('#answer').value='';$('#feedback').innerHTML='';$('#qbar').style.width=((qi+1)/words.length*100)+'%'}function check(){let w=current(),ok=$('#answer').value.trim().toLowerCase()===w.term;if(ok){w.mastered=true;save();$('#feedback').innerHTML=`<div class="feedback ok">✓ 拼写正确！${w.term} · ${w.meaning}</div>`;setTimeout(()=>{qi=(qi+1)%words.length;renderQuiz();speak(current().term)},1100)}else $('#feedback').innerHTML=`<div class="feedback bad">再想一想 · 提示：${w.term[0]} _ _ _ · ${w.meaning}</div>`}
$('#query').onkeydown=e=>e.key==='Enter'&&lookup();$('#answer').onkeydown=e=>e.key==='Enter'&&check();$('#file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let wb=XLSX.read(await f.arrayBuffer()),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1}),book=f.name.replace(/\.(xlsx?|csv)$/i,''),items=rows.slice(1).filter(r=>r[0]).map(r=>{let k=String(r[0]).trim().toLowerCase(),d=dict[k]||{};return{term:k,phonetic:String(r[1]||d.phonetic||'/ — /'),meaning:String(r[2]||d.meaning||'待补充释义'),example:String(r[3]||d.example||''),book}});words=[...items,...words];save();go('books');toast(`已识别 ${items.length} 个单词，创建词书「${book}」`)}catch(e){toast('文件解析失败，请检查格式')}e.target.value=''};let installPrompt;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#install').classList.remove('hide')});$('#install').onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('#install').classList.add('hide')}};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=6',{updateViaCache:'none'}).then(r=>r.update());buildKeyboards();render();
</script></body></html>
